upstream local_appium {
    server host.docker.internal:4723;
    keepalive 16;
}
server {
    listen 4725;
    listen 4726;
    listen 4727;
    listen 4728;
    location /wd/hub/ {
        proxy_pass http://local_appium/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout 10s;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
    location / {
        proxy_pass http://local_appium;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout 10s;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
