#=====================================================#
#=================== Test users ======================#
#=====================================================#
# Pool membership uses the "::" separator. Each member key resolves to
# <key>.login and <key>.password below.
#
# This app build accepts exactly three accounts, as documented on its own login
# screen: standard_user, locked_out_user and problem_user (all "secret_sauce").
# performance_glitch_user and visual_user exist only in the web version of Swag
# Labs and are NOT present here.

# Deterministic user for the functional cases SL-01..SL-15.
# Intentionally a single user: problem_user renders broken product images, which
# would make the grid assertions flaky if the lease handed it out at random.
valid_users_pool=standardUser

# Every account that can actually reach the Products page. Read (not leased) by SL-16.
# locked_out_user is excluded: its credentials are valid but the account is blocked,
# so it cannot satisfy "logs in and reaches Products".
all_valid_users_pool=standardUser::problemUser

# Credentials the app must reject. Used by SL-17 only.
invalid_users_pool=invalidUser

standardUser.login=standard_user
standardUser.password=secret_sauce

problemUser.login=problem_user
problemUser.password=secret_sauce

invalidUser.login=invalid_user
invalidUser.password=secret_sauce
