#========= Android device, this machine =======#
# Which emulator or handset a local run drives. Layered on top of android.properties by
# SwagLabsBaseTest, and skipped when the run is served by a device farm - a Zebrunner
# launcher leases a device from a pool instead and passes its own
# -Dcapabilities.deviceName, so a value pinned here would fight the pool.
#
# Still overridable on the command line:
#   mvn test -Dsuite=android -Dcapabilities.deviceName=emulator-5556

capabilities.deviceName=emulator-5554
