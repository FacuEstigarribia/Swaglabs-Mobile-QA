#=========== iOS device, this machine =========#
# Which simulator or handset a local run drives. Layered on top of ios.properties by
# SwagLabsBaseTest, and skipped when the run is served by a device farm - a Zebrunner
# launcher leases a device from a pool instead and passes its own
# -Dcapabilities.deviceName. The udid matters most here: the launcher does not send one,
# so a udid left in ios.properties would follow the run onto the farm and fail session
# creation with a device that does not exist there.
#
# Still overridable on the command line:
#   mvn test -Dsuite=ios -Dcapabilities.udid=<YOUR-SIMULATOR-UDID>

capabilities.deviceName=iPhone 17
capabilities.platformVersion=26.5
capabilities.udid=B7C13093-3F0C-4711-8801-0178C4EFECF5
