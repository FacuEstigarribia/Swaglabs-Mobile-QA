#============== iOS capabilities ==============#
# Loaded by SwagLabsBaseTest via Carina's CapabilitiesLoader, selected by the
# "platform" parameter in the TestNG suite.
#
# Override any of these on the command line, e.g.
#   mvn test -Dsuite=ios -Dcapabilities.udid=<YOUR-SIMULATOR-UDID>
#
# Device identity is NOT here: it lives in ios-local.properties, which SwagLabsBaseTest
# layers on top only when the run is not served by a device farm.

capabilities.platformName=IOS
capabilities.automationName=XCUITest
capabilities.bundleId=com.saucelabs.SwagLabsMobileApp
capabilities.newCommandTimeout=240
# WebDriverAgent is built on first use and that build is slow.
capabilities.wdaLaunchTimeout=240000
capabilities.wdaConnectionTimeout=240000
capabilities.noReset=false
