#============ Android capabilities ============#
# Loaded by SwagLabsBaseTest via Carina's CapabilitiesLoader, selected by the
# "platform" parameter in the TestNG suite.
#
# Override any of these on the command line, e.g.
#   mvn test -Dsuite=android -Dcapabilities.deviceName=emulator-5556
#
# Device identity is NOT here: it lives in android-local.properties, which
# SwagLabsBaseTest layers on top only when the run is not served by a device farm.

capabilities.platformName=ANDROID
capabilities.automationName=UiAutomator2
capabilities.appPackage=com.swaglabsmobileapp
capabilities.appActivity=com.swaglabsmobileapp.SplashActivity
capabilities.newCommandTimeout=180
# The emulator can be slow to start its instrumentation server under host load; the
# 30s default surfaces as "The instrumentation process cannot be initialized".
capabilities.uiautomator2ServerLaunchTimeout=120000
capabilities.uiautomator2ServerInstallTimeout=120000
capabilities.adbExecTimeout=120000
capabilities.androidInstallTimeout=120000
# Relaunch the app for each test method, so every test starts with an empty cart
# and no session.
capabilities.noReset=false
capabilities.autoGrantPermissions=true
