#=====================================================#
#============= Carina core configuration =============#
#=====================================================#

#============== Appium / driver ======================#
# Appium 3 serves at the root path - do NOT append /wd/hub here.
# A Zebrunner launcher replaces this with its farm's hub via -Dselenium_url.
selenium_url=http://localhost:4723
# Which device farm serves the run, empty for a local Appium server. Declared (rather
# than left absent) because Carina's R only lets a -D argument override a key that
# already exists in this file, and SwagLabsBaseTest reads it to decide whether to layer
# on capabilities/<platform>-local.properties. A Zebrunner launcher sets it from the
# suite's "provider" parameter, so a launcher run resolves to the pool's device.
provider=
driver_mode=method_mode
max_driver_count=1
init_retry_count=1
init_retry_interval=5

# Platform capabilities are supplied per-suite in src/test/resources/testng_suites/*.xml
# so this file stays platform-neutral.
#=====================================================#

#============== Timeouts =============================#
implicit_timeout=3
explicit_timeout=30
retry_interval=500
element_loading_strategy=BY_PRESENCE
page_opening_strategy=BY_ELEMENT
#=====================================================#

#============== Execution ============================#
# One physical device per platform, so the suite runs single-threaded.
thread_count=1
data_provider_thread_count=1
retry_count=0
env=DEMO
#=====================================================#

#============== Reporting ============================#
core_log_level=INFO
auto_screenshot=false
allow_fullsize_screenshot=true
keep_all_screenshots=true
max_screen_history=10
project_report_directory=./target/reports
big_screen_width=-1
big_screen_height=-1
small_screen_width=90
small_screen_height=60
#=====================================================#

#============== Device defaults ======================#
locale=en_US
language=en
adb_host=NULL
adb_port=NULL
#=====================================================#
