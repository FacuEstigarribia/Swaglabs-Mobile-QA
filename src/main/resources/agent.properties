#=====================================================#
#========== Zebrunner reporting agent ================#
#=====================================================#
# Read by com.zebrunner:agent-core, which carina-core already brings in transitively -
# no extra dependency in pom.xml is needed for this file to take effect.
#
# Every key can be overridden by a -D java argument or by the matching REPORTING_*
# environment variable, and an environment variable wins over this file. That is how a
# Zebrunner launcher supplies them: the pipeline injects REPORTING_ENABLED,
# REPORTING_SERVER_HOSTNAME and REPORTING_SERVER_ACCESS_TOKEN into the build, so a
# launcher run reports without this file being changed.

# Off by default, so a local run stays local and needs no token.
reporting.enabled=true

reporting.server.hostname=solvdinternal.zebrunner.com

# The access token is a credential and is deliberately NOT stored here. To report from a
# local run, take one from Zebrunner's "Account & Profile" page and pass it in:
#   export REPORTING_SERVER_ACCESS_TOKEN=<token>
#   mvn clean test -Dsuite=smoke -Dreporting.enabled=true
# Leaving the key out entirely (rather than blank) keeps the environment variable in
# charge of it.
#reporting.server.access-token=

# The project test runs are reported into. Also read by Zebrunner's launcher repository
# scan, which takes the project for every generated job from this key - so it has to
# match the project whose test cases were imported (SAUCEM).
reporting.project-key=SAUCEM

reporting.run.display-name=Swag Labs Mobile
reporting.run.environment=DEMO
#=====================================================#
